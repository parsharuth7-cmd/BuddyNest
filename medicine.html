<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medicine Shop</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="medicine.css">
</head>

<body>

<h2 class="title"><b>💊 Medicine Store</b></h2>

<!--cart-->
<div class="cart">
    <h2><b>Cart</b></h2>
    <div id="cartBox"></div>
    <h3 id="total"></h3>
    <button onclick="goCheckout()">Checkout</button>
</div>

<div class="container">

    <div class="card">
        <img src="image/fever.jpeg">
        <h3>Paracetamol</h3>
        <p>Price: 50</p>
        <button onclick="addToCart('Paracetamol',50)">Add</button>
    </div>

    <div class="card">
        <img src="image/alergy.jpeg">
        <h3>Antibiotic</h3>
        <p>Price: 120</p>
        <button onclick="addToCart('Antibiotic',120)">Add</button>
    </div>

    <div class="card">
        <img src="image/flea.jpeg">
        <h3>Serum</h3>
        <p>Price: 200</p>
        <button onclick="addToCart('Serum',200)">Add</button>
    </div>

</div>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, Price){
    cart.push({name:name, Price: Number(Price)});
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function renderCart(){

    let box = document.getElementById("cartBox");
    box.innerHTML = "";

    let total = 0;

    cart.forEach((item, index) =>{
        let price = Number(item.Price || 0);
        box.innerHTML += `<p>${item.name} - ${price}/=
            <button onclick="removeItem(${index})">
                Remove
            </button>
            </p>`;

        total += price;
    });

    document.getElementById("total").innerText = "Total: " + total + "/=";
}

function removeItem(index){
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}


function goCheckout(){
    window.location.href = "checkout.html";
}


renderCart();
</script>

</body>
</html>
